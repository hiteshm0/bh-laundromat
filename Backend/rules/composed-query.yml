rules:
  - id: laundromat.concatenated-query
    languages: [javascript]
    severity: WARNING
    message: SQL text is constructed with a value. This query style needs manual review.
    pattern: 'const $SQL = "SELECT id FROM swatches WHERE color = ''" + $TERM + "''";'
  - id: laundromat.composed-prepare
    languages: [javascript, typescript]
    severity: WARNING
    message: Prepared statement receives concatenated text. Check argument binding.
    pattern: $DB.prepare($TEXT + $VALUE)
  - id: laundromat.stock-query
    languages: [javascript]
    severity: WARNING
    message: The aisle value changes the inventory SQL statement. Check parameter binding.
    pattern: $DB.prepare(`SELECT sku FROM stock WHERE aisle = '${$VALUE}' ORDER BY sku`)
