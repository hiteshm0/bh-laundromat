[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bh-laundromat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer==0.29.2", "semgrep==1.186.0"]

[project.scripts]
laundromat = "laundromat.cli:app"

[tool.setuptools]
packages = ["laundromat"]
